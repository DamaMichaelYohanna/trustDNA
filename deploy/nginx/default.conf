# ==============================================================================
# TrustDNA - Production Nginx Reverse Proxy & CDN Edge Configuration
# ==============================================================================

upstream trustdna_backend {
    server trustdna-api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Global Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Root directory for static web console & landing page
    root /usr/share/nginx/html;
    index index.html;

    # 1. CDN Distribution Endpoint for Web Collector SDK
    location /v1/trustdna.js {
        alias /usr/share/nginx/html/public/v1/trustdna.js;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/javascript;
    }

    # 2. REST API Reverse Proxy
    location /api/ {
        proxy_pass http://trustdna_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 3. Interactive API Documentation
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://trustdna_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Static Frontend Routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
